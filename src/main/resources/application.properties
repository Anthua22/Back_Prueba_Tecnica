server.port=5000

# API existente (mocks del enunciado)
existing-api.base-url=http://localhost:3001
existing-api.connect-timeout=1s
# Un producto que tarda más que esto se omite de la respuesta
existing-api.response-timeout=2s
existing-api.max-connections=500
# Peticiones concurrentes al backend por cada petición entrante
existing-api.concurrency-per-request=16
existing-api.cache-ttl=60s
existing-api.cache-max-size=10000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
